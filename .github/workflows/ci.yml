name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          # placeholders: the build never calls the API
          API_BACKEND_URL: http://localhost:5241
          API_SECURITY_KEY: ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
